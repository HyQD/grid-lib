[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HyQD-grid-lib"
dynamic = ["version"]
description = "Grid-based tools for quantum dynamics and structure calculations."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
  { name = "Håkon Emil Kristiansen" },
  { name = "Einar Aurbakken" },
]
dependencies = [
  "numpy>=2.5.2,<2.6",
  "scipy>=1.18.0,<1.19",
  "opt-einsum",
  "numba>=0.67.0,<0.68",
  "sympy",
  "packaging",
  "tqdm",
  "matplotlib",
]

[project.optional-dependencies]
test = [
  "pytest",
]
fast = [
  "py3nj",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-jupyter>=0.24",
  "pymdown-extensions>=10.0",
]
dev = [
  "HyQD-grid-lib[test,docs]",
]

[project.urls]
Homepage = "https://github.com/HyQD/grid-lib"
Documentation = "https://hyqd.github.io/grid-lib/"

[tool.setuptools.dynamic]
version = { attr = "grid_lib.version.__version__" }

[tool.setuptools.packages.find]
include = ["grid_lib*"]

[tool.setuptools.package-data]
"grid_lib.spherical_coordinates.Lebedev" = ["*"]
